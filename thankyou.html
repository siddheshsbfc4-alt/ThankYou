<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thank You</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f7f8;
        --card-bg: rgba(255, 255, 255, 0.75);
        --card-border: rgba(23, 23, 23, 0.08);
        --text: #171717;
        --muted: #6b6b6f;
        --accent: #7c5cff;
        --accent-soft: rgba(124, 92, 255, 0.12);
        --shadow: rgba(23, 23, 23, 0.12);
        --check-fg: #ffffff;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        min-height: 100svh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        position: relative;
        overflow: hidden;
        font-family: "Lexend", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      /* Floating accent blobs */
      .blob {
        position: fixed;
        border-radius: 50%;
        filter: blur(70px);
        opacity: 0.25;
        z-index: 0;
        will-change: transform;
      }

      .blob-a {
        width: 34rem;
        height: 34rem;
        top: -10rem;
        left: -8rem;
        background: var(--accent);
        animation: float-a 16s ease-in-out infinite;
      }

      .blob-b {
        width: 30rem;
        height: 30rem;
        bottom: -10rem;
        right: -8rem;
        background: #22d3ee;
        opacity: 0.22;
        animation: float-b 20s ease-in-out infinite;
      }

      .blob-c {
        width: 22rem;
        height: 22rem;
        bottom: 10%;
        left: 8%;
        background: #ff6b9d;
        opacity: 0.16;
        animation: float-c 18s ease-in-out infinite;
      }

      @keyframes float-a {
        0%, 100% { transform: translate(0, 0) scale(1); }
        50% { transform: translate(4rem, 3rem) scale(1.1); }
      }

      @keyframes float-b {
        0%, 100% { transform: translate(0, 0) scale(1); }
        50% { transform: translate(-3rem, -4rem) scale(1.08); }
      }

      @keyframes float-c {
        0%, 100% { transform: translate(0, 0) scale(1); }
        50% { transform: translate(2rem, -2rem) scale(1.15); }
      }

      /* Card */
      .card {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 26rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.25rem;
        text-align: center;
        padding: 3rem 2.25rem 2.5rem;
        border-radius: 1.5rem;
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        box-shadow: 0 20px 60px -15px var(--shadow);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        opacity: 0;
        transform: translateY(24px) scale(0.96);
        animation: card-in 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards;
      }

      @keyframes card-in {
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      .logo {
        display: block;
        opacity: 0;
        transform: translateY(10px);
        animation: fade-up 0.6s ease 0.25s forwards;
      }

      /* Check icon */
      .icon-wrap {
        position: relative;
        width: 5rem;
        height: 5rem;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .icon-ring {
        position: absolute;
        inset: 0;
        border-radius: 9999px;
        background: var(--accent);
        opacity: 0.3;
        animation: pulse-ring 2.4s ease-out infinite;
      }

      @keyframes pulse-ring {
        0% { transform: scale(0.85); opacity: 0.4; }
        70% { transform: scale(1.5); opacity: 0; }
        100% { transform: scale(1.5); opacity: 0; }
      }

      .icon {
        position: relative;
        width: 4rem;
        height: 4rem;
        border-radius: 9999px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--accent);
        box-shadow: 0 10px 30px -8px rgba(124, 92, 255, 0.6);
        opacity: 0;
        transform: scale(0.5);
        animation: icon-in 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.4s forwards;
      }

      @keyframes icon-in {
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      .icon svg {
        width: 1.9rem;
        height: 1.9rem;
        color: var(--check-fg);
      }

      .icon svg path {
        stroke-dasharray: 24;
        stroke-dashoffset: 24;
        animation: draw-check 0.5s ease 0.85s forwards;
      }

      @keyframes draw-check {
        to {
          stroke-dashoffset: 0;
        }
      }

      h1 {
        margin: 0;
        font-size: 2rem;
        font-weight: 800;
        letter-spacing: -0.02em;
        color: var(--text);
        opacity: 0;
        transform: translateY(10px);
        animation: fade-up 0.6s ease 0.55s forwards;
      }

      p {
        margin: 0;
        max-width: 24rem;
        line-height: 1.6;
        color: var(--muted);
        opacity: 0;
        transform: translateY(10px);
        animation: fade-up 0.6s ease 0.7s forwards;
      }

      @keyframes fade-up {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .note {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        font-size: 0.8rem;
        font-weight: 500;
        color: var(--accent);
        background: var(--accent-soft);
        border: 1px solid rgba(124, 92, 255, 0.25);
        padding: 0.4rem 0.9rem;
        border-radius: 9999px;
        opacity: 0;
        transform: translateY(10px);
        animation: fade-up 0.6s ease 0.78s forwards;
      }

      .note svg {
        flex-shrink: 0;
        animation: tick 2.5s linear infinite;
        animation-delay: 1.4s;
      }

      @keyframes tick {
        0%, 20% { transform: rotate(0deg); }
        50% { transform: rotate(180deg); }
        80%, 100% { transform: rotate(360deg); }
      }

      .button {
        position: relative;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        overflow: hidden;
        text-decoration: none;
        border-radius: 0.75rem;
        background: var(--accent);
        color: #ffffff;
        padding: 0.75rem 1.75rem;
        font-weight: 600;
        font-size: 0.95rem;
        box-shadow: 0 12px 30px -10px rgba(124, 92, 255, 0.55);
        opacity: 0;
        transform: translateY(10px);
        animation: fade-up 0.6s ease 0.85s forwards;
        border: none;
        cursor: pointer;
        font-family: inherit;
        transition: transform 0.25s ease, box-shadow 0.25s ease, background-color 0.25s ease;
      }

      .button:hover {
        background: #6a47f0;
        transform: translateY(-2px);
        box-shadow: 0 16px 36px -8px rgba(124, 92, 255, 0.65);
      }

      .button:active {
        transform: translateY(0);
      }

      .button::before {
        content: "";
        position: absolute;
        top: 0;
        left: -60%;
        width: 40%;
        height: 100%;
        background: rgba(255, 255, 255, 0.35);
        transform: skewX(-20deg);
        transition: left 0.6s ease;
      }

      .button:hover::before {
        left: 120%;
      }

      .close-fallback {
        display: none;
        font-size: 0.8rem;
        color: var(--muted);
        opacity: 0;
        animation: fade-up 0.4s ease forwards;
      }

      .badge {
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--accent);
        opacity: 0;
        animation: fade-up 0.6s ease 0.4s forwards;
      }

      /* Confetti */
      .confetti {
        position: fixed;
        top: -10px;
        width: 8px;
        height: 14px;
        opacity: 0.9;
        z-index: 2;
        animation: confetti-fall linear forwards;
      }

      @keyframes confetti-fall {
        to {
          transform: translateY(110vh) rotate(720deg);
          opacity: 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .blob,
        .icon-ring,
        .card,
        .logo,
        .icon,
        .icon svg path,
        h1,
        p,
        .note,
        .note svg,
        .button,
        .badge,
        .confetti {
          animation: none !important;
        }
        .card {
          opacity: 1;
          transform: none;
        }
        .logo,
        .icon,
        h1,
        p,
        .note,
        .button,
        .badge {
          opacity: 1;
          transform: none;
        }
        .icon svg path {
          stroke-dashoffset: 0;
        }
      }
    </style>
  </head>
